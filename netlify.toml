[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA-роутинг: усі шляхи віддають index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Безпекові заголовки.
# Geolocation дозволена лише самому застосунку — це критично для курʼєрського
# трекінгу (див. docs/07-geolocation.md).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Service worker не має кешуватись — інакше застосунок «залипає» на старій версії
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

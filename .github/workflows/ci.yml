name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — щоб номер збірки (кількість комітів) був справжнім
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Форматування
        run: npm run format:check

      - name: Лінт
        run: npm run lint

      - name: Тести
        run: npm test

      - name: Збірка demo
        run: npm run build
        env:
          VITE_APP_ENV: demo

      # Механіка оболонки перевіряється на demo-збірці: потрібен робочий
      # вхід і дані, а не справжня база. Ловить клас «фонове оновлення
      # стирає те, що людина зараз друкує» — саме він зробив вкладку
      # «Замовлення» непридатною одразу після переходу на живий бекенд.
      - name: Браузер для смоуку
        run: npx playwright install --with-deps chromium

      - name: Набране не зникає під оновленням
        run: npm run smoke:form
        env:
          SMOKE_STRICT: '1'

      - name: Збірка в один файл
        run: npm run build:standalone

      # ── Перевірки продакшн-збірки ─────────────────────────────────────────
      # Саме production-бандл потрапляє до реальних курʼєрів і реальної бази,
      # тож перевіряємо його, а не demo. У demo-збірці моковий адаптер
      # із демо-доступами присутній свідомо: за ним немає жодних реальних
      # даних (див. scripts/config.mjs).
      - name: Продакшн-збірка
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

      # Найдорожча можлива помилка: service_role-ключ дає повний доступ
      # до бази в обхід RLS
      - name: Секретів у бандлі немає
        run: |
          if grep -rIlE 'service_role|SUPABASE_SERVICE_ROLE|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' dist/ 2>/dev/null; then
            echo "::error::У продакшн-бандлі знайдено те, що схоже на секретний ключ. Див. docs/05-roles-auth-rls.md"
            exit 1
          fi
          echo "OK"

      # B18: демо-доступи не мають потрапляти до реальних користувачів.
      # Ця перевірка вже одного разу впіймала реальний витік — вони
      # продублювались в екрані логіна в обхід підміни адаптера.
      - name: Демо-доступів у продакшн-бандлі немає
        run: |
          if grep -rIlE 'Skuter2607|RocketBoss26' dist/ 2>/dev/null; then
            echo "::error::У продакшн-бандлі знайдено демо-паролі. Баг B18 у docs/09-audit.md"
            exit 1
          fi
          echo "OK"

      # Моковий адаптер не має існувати в продакшн-збірці взагалі.
      #
      # ⚠️ Маркери мають бути унікальні для мокових даних. Раніше тут стояло
      # «Суші Мар» — і перевірка була беззмістовна одразу двічі: назва
      # закладу була ще й захардкоджена в UI, а esbuild екранував кирилицю
      # у \uXXXX, тож пошук не знаходив нічого НІКОЛИ. Перше виправлено
      # в коді, друге — параметром charset: 'utf8' у scripts/build.mjs.
      - name: Мокового адаптера в продакшн-бандлі немає
        run: |
          for marker in "Олег Ткачук" "rd-oleh-07" "Метельне" "Демо-режим"; do
            if grep -rIl "$marker" dist/ 2>/dev/null; then
              echo "::error::У продакшн-бандлі знайдено моковий маркер: $marker"
              exit 1
            fi
          done
          echo "OK"

      # Поверхні клієнта й закладу — симуляція cstllife (ADR-0001).
      # У продакшн-збірці Rocket Delivery їх не має існувати навіть
      # мертвим кодом: demo.stub.js віддає порожній реєстр surfaces,
      # тож business.js і client.js не імпортуються взагалі.
      - name: Поверхонь cstllife у продакшн-бандлі немає
        run: |
          for marker in "симуляція cstllife" "Симуляція cstllife" "Філадельфія" \
                        "Готово до забору" "Код для курʼєра" "Куди везти"; do
            if grep -rIl "$marker" dist/ 2>/dev/null; then
              echo "::error::У продакшн-бандлі знайдено демо-поверхню cstllife: $marker"
              exit 1
            fi
          done
          echo "OK"

      # Пульт симуляції не існує в реальній системі взагалі: там замовлення
      # приносять люди, кухня працює сама, годинник іде.
      - name: Пульта демо в продакшн-бандлі немає
        run: |
          for marker in "Пульт демо" "Генератор замовлень" "Автопілот кухні" \
                        "demo-generator" "demo-spawn" "setDemoSettings"; do
            if grep -rIl "$marker" dist/ 2>/dev/null; then
              echo "::error::У продакшн-бандлі знайдено пульт демо-симуляції: $marker"
              exit 1
            fi
          done
          echo "OK"

      # Кнопки входу одним кліком — теж частина демо-режиму.
      # data-demo — курʼєр і адмін, data-role — клієнт і заклад.
      - name: Демо-входу в продакшн-бандлі немає
        run: |
          for marker in 'data-demo' 'data-role' 'reset-demo'; do
            if grep -rIl "$marker" dist/ 2>/dev/null; then
              echo "::error::У продакшн-бандлі знайдено демо-вхід одним кліком: $marker"
              exit 1
            fi
          done
          echo "OK"

      # ── Чи вона взагалі відкривається ────────────────────────────────────
      # Усе вище перевіряє ВМІСТ бандла. Жодна з тих перевірок не відкривала
      # сторінку — і саме тому на живий сайт поїхала збірка, що падала до
      # першого рядка розмітки: `process is not defined`. Білий екран,
      # усі перевірки зелені.
      #
      # `process` у браузері не існує; збірник підставляє значення, але
      # тільки для буквального `process.env.ІМʼЯ`. Звертання через змінну
      # лишалось у коді як є. Дешевий сторож саме на цей клас:
      - name: Слова process у бандлі немає
        run: |
          if grep -oE '\bprocess\.env' dist/app.js 2>/dev/null; then
            echo "::error::У бандлі лишилось process.env — збірник не підставив значення."
            echo "::error::Звертатись треба буквально: process.env.VITE_X, не process.env[k]."
            exit 1
          fi
          echo "OK"

      # А це — справжня перевірка: підняти збірку й відкрити її браузером.
      # Ловить весь клас «зібралось, опублікувалось, не працює», а не одну
      # відому пастку. Браузер уже поставлено вище.
      - name: Продакшн-збірка відкривається
        run: npm run smoke:prod
        env:
          SMOKE_STRICT: '1' # у CI відсутній браузер — це помилка, а не «пропустимо»

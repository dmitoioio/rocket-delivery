name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Запуск руками з вкладки Actions. Доданий після випадку 06.08: пуші
  # перестали породжувати запуски (коміт на місці, гілка оновлена, запуску
  # немає), і перевірити код не було чим узагалі. Деплой таку кнопку мав
  # і врятував ситуацію; CI не мав.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 06.08 цей прогін завис і 17 хвилин тримав ЄДИНИЙ доступний виконавець.
    # Публікація в цей час стояла в черзі, не дочекалась і була скасована —
    # тобто зависла перевірка коду не пустила виправлення на сайт.
    # Обмеження часу перетворює це з тупика на червону перевірку.
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — щоб номер збірки (кількість комітів) був справжнім
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Форматування
        run: npm run format:check

      - name: Лінт
        run: npm run lint

      - name: Тести
        run: npm test

      - name: Збірка demo
        run: npm run build
        env:
          VITE_APP_ENV: demo

      # Поки dist ще демо-вий: маркери мають у ньому БУТИ. Інакше
      # перевірка нижче проходить порожньою й нічого не стереже
      - name: Демо-маркери живі
        run: node scripts/check-markers.mjs present

      # ⚠️ Браузерних перевірок тут НЕМАЄ навмисно, хоча спокуса є.
      #
      # Виконавець у цього репозиторію фактично один. Поки CI ставив
      # Chromium і ганяв смоук (це кілька хвилин), публікація стояла в
      # черзі — 06.08 вона так і не дочекалась виконавця й була скасована.
      # Тобто перевірка, додана заради безпеки релізу, сама не пустила
      # виправлення на сайт.
      #
      # Тому браузер лишається ТАМ, ДЕ ЗАХИЩАЄ: у deploy-pages.yml, перед
      # самою публікацією. Ціна помилки різна — тут це червона галочка,
      # там це білий екран у власника й курʼєрів.
      #
      # Локально обидва смоуки запускаються так:
      #   VITE_APP_ENV=demo npm run build && npm run smoke:form
      #   VITE_APP_ENV=production … npm run build && npm run smoke:prod
      - name: Збірка в один файл
        run: npm run build:standalone

      # ── Перевірки продакшн-збірки ─────────────────────────────────────────
      # Саме production-бандл потрапляє до реальних курʼєрів і реальної бази,
      # тож перевіряємо його, а не demo. У demo-збірці моковий адаптер
      # із демо-доступами присутній свідомо: за ним немає жодних реальних
      # даних (див. scripts/config.mjs).
      - name: Продакшн-збірка
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

      # Найдорожча можлива помилка: service_role-ключ дає повний доступ
      # до бази в обхід RLS
      - name: Секретів у бандлі немає
        run: |
          if grep -rIlE 'service_role|SUPABASE_SERVICE_ROLE|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' dist/ 2>/dev/null; then
            echo "::error::У продакшн-бандлі знайдено те, що схоже на секретний ключ. Див. docs/05-roles-auth-rls.md"
            exit 1
          fi
          echo "OK"

      # B18: демо-доступи не мають потрапляти до реальних користувачів.
      # Ця перевірка вже одного разу впіймала реальний витік — вони
      # продублювались в екрані логіна в обхід підміни адаптера.
      - name: Демо-доступів у продакшн-бандлі немає
        run: |
          if grep -rIlE 'Skuter2607|RocketBoss26' dist/ 2>/dev/null; then
            echo "::error::У продакшн-бандлі знайдено демо-паролі. Баг B18 у docs/09-audit.md"
            exit 1
          fi
          echo "OK"

      # Демо-маркери: мокові дані, поверхні cstllife, пульт симуляції,
      # кнопки демо-входу. Список — у scripts/check-markers.mjs одним
      # місцем, бо чотири копії в YAML розходились і протухали поодинці.
      #
      # ⚠️ Перевірка двобічна, і це не надмірність. За одну добу маркери
      # протухли ТРИЧІ: «Суші Мар» не знаходився ніколи (екранована
      # кирилиця — зелена порожня перевірка), «Метельне» й «Готово до
      # забору» стали продакшн-текстом і валили CI на правильному коді.
      # Другий бік (маркер Є в demo) ловить саме перший випадок — той,
      # якого не видно очима.
      - name: Демо в продакшн-бандлі немає
        run: node scripts/check-markers.mjs absent

      # Перевірка «а вона взагалі відкривається?» живе в deploy-pages.yml,
      # перед самою публікацією — див. пояснення вище про єдиний виконавець.

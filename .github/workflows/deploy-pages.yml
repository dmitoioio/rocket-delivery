name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Дозволяє задеплоїти вручну з вкладки Actions, не чекаючи пушу
  workflow_dispatch:

# Потрібно для публікації на Pages через Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; новий пуш не скасовує вже початий
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Уся історія: номер збірки — це кількість комітів, а за мілкого
      # checkout (depth=1 за замовчуванням) вона завжди дорівнювала б 1,
      # тобто лічильник ніколи б не змінювався — рівно те, для чого його
      # й додано
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── Ключі мають бути ─────────────────────────────────────────────────
      # Раніше тут збиралось demo, бо реального Supabase не було. Тепер
      # живий сайт — це справжній застосунок, і мовчазне падіння назад
      # у demo було б найгіршим з можливих: сайт відкривався б, показував
      # знайомі дані й виглядав робочим, поки насправді жодне замовлення
      # нікуди не йшло. Тому — гучна помилка замість тихої підміни.
      - name: Перевірити ключі
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Немає секретів VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY."
            echo "::error::Додати: Settings → Secrets and variables → Actions → New repository secret."
            echo "::error::Значення — у Supabase: Project Settings → API (Project URL і anon public)."
            echo "::error::Покрокова інструкція: docs/15-setup-supabase.md"
            exit 1
          fi
          echo "OK — ключі на місці"

      - name: Збірка production
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── Не публікувати білий екран ───────────────────────────────────────
      # Саме тут не вистачало перевірки. Збірка «успішна» ще нічого не
      # означає: одного разу вона зібралась, опублікувалась і падала до
      # першого рядка розмітки (`process is not defined`). CI при цьому
      # був зелений — він перевіряв вміст файлу, а не те, чи він
      # запускається. Тепер сторінку відкривають ДО публікації.
      - name: Слова process у бандлі немає
        run: |
          if grep -oE '\bprocess\.env' dist/app.js 2>/dev/null; then
            echo "::error::У бандлі лишилось process.env — збірник не підставив значення."
            exit 1
          fi
          echo "OK"

      - name: Браузер для смоуку
        run: npx playwright install --with-deps chromium

      - name: Збірка відкривається
        run: npm run smoke:prod
        env:
          SMOKE_STRICT: '1'

      # GitHub Pages інакше проганяє все через Jekyll і ігнорує деякі файли
      - name: Вимкнути Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
